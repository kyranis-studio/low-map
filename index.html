<script>
function hexToRgb(h) {
  const r = parseInt(h.slice(1,3), 16);
  const g = parseInt(h.slice(3,5), 16);
  const b = parseInt(h.slice(5,7), 16);
  return [r,g,b];
}

function rgbToHex(r,g,b) {
  return '#' + [r,g,b].map(c => Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2,'0')).join('');
}

function lerp(a,b,t) { return a + (b-a)*t; }

function computeGradient(base, variation) {
  const p = variation / 100;
  const [br, bg, bb] = hexToRgb(base);
  const colorA = rgbToHex(lerp(br, 255, p), lerp(bg, 255, p), lerp(bb, 255, p));
  const colorB = rgbToHex(lerp(br, 0, p), lerp(bg, 0, p), lerp(bb, 0, p));
  return { colorA, colorB };
}

function getEntryColors(entry) {
  return computeGradient(entry.base, entry.variation);
}

function sampleEntryGradient(entry, t) {
  const { colorA, colorB } = getEntryColors(entry);
  const [r1,g1,b1] = hexToRgb(colorA);
  const [r2,g2,b2] = hexToRgb(colorB);
  if (entry.inverted) t = 1 - t;
  return [lerp(r1,r2,t), lerp(g1,g2,t), lerp(b1,b2,t)];
}

let presets = [];
let activePresetId = null;
let nextId = 1;

function getPresetById(id) { return presets.find(p => p.id === id); }

function addPreset(name) {
  const id = "p" + (nextId++);
  presets.push({ id, name, colors: [] });
  activePresetId = id;
  renderPresetTabs();
  renderPalette();
}

function removePreset(id) {
  if (presets.length <= 1) return;
  const idx = presets.findIndex(p => p.id === id);
  presets.splice(idx, 1);
  if (activePresetId === id) {
    activePresetId = presets[Math.min(idx, presets.length - 1)].id;
  }
  renderPresetTabs();
  renderPalette();
}

function renamePreset(id, name) {
  const p = getPresetById(id);
  if (p) p.name = name;
  renderPresetTabs();
}

function setActivePreset(id) {
  activePresetId = id;
  renderPresetTabs();
  renderPalette();
}

function addColorToActive() {
  const p = getPresetById(activePresetId);
  if (!p) return;
  p.colors.push({ name: "New Color", base: "#808080", variation: 20, enabled: true, inverted: false });
  renderPalette();
  renderAll();
}

function duplicateColor(pid, idx) {
  const p = getPresetById(pid);
  if (!p) return;
  const orig = p.colors[idx];
  if (!orig) return;
  const copy = { ...orig, name: orig.name + " copy" };
  p.colors.splice(idx + 1, 0, copy);
  renderPalette();
  renderAll();
}

function removeColor(pid, idx) {
  const p = getPresetById(pid);
  if (!p) return;
  p.colors.splice(idx, 1);
  renderPalette();
  renderAll();
}

function moveColor(pid, idx, dir) {
  const p = getPresetById(pid);
  if (!p) return;
  const j = idx + dir;
  if (j < 0 || j >= p.colors.length) return;
  [p.colors[idx], p.colors[j]] = [p.colors[j], p.colors[idx]];
  renderPalette();
  renderAll();
}

function updateColor(pid, idx, field, value) {
  const p = getPresetById(pid);
  if (!p) return;
  const c = p.colors[idx];
  if (field === 'base') {
    c.base = value.startsWith('#') ? value : '#' + value;
  } else if (field === 'variation') {
    c.variation = Math.max(0, Math.min(100, parseFloat(value) || 0));
  } else {
    c.name = value;
  }
  renderPalette();
  renderAll();
}

function updateVariation(pid, idx, value) {
  const p = getPresetById(pid);
  if (!p) return;
  const c = p.colors[idx];
  c.variation = Math.max(0, Math.min(100, parseFloat(value) || 0));
  const card = document.getElementById('palette').children[idx];
  if (card) {
    card.querySelector('.var-val').textContent = Math.round(c.variation) + '%';
    const { colorA, colorB } = getEntryColors(c);
    const swatch = card.querySelector('.mini-swatch');
    if (swatch) swatch.style.background = 'linear-gradient(to bottom,' + (c.inverted ? colorB : colorA) + ',' + (c.inverted ? colorA : colorB) + ')';
  }
  renderAll();
}

function setColorEnabled(pid, idx, enabled) {
  const p = getPresetById(pid);
  if (!p || !p.colors[idx]) return;
  p.colors[idx].enabled = enabled;
  renderPalette();
}

function toggleInvert(pid, idx) {
  const p = getPresetById(pid);
  if (!p || !p.colors[idx]) return;
  p.colors[idx].inverted = !p.colors[idx].inverted;
  renderPalette();
}

function renderPresetTabs() {
  const el = document.getElementById('presetTabs');
  el.innerHTML = '';
  presets.forEach(p => {
    const tab = document.createElement('button');
    tab.className = 'preset-tab' + (p.id === activePresetId ? ' active' : '');
    tab.innerHTML = '<span>' + p.name + '</span><span class="close-btn" onclick="event.stopPropagation();removePreset(\'' + p.id + '\')"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg></span>';
    tab.onclick = () => setActivePreset(p.id);
    tab.title = 'Click to edit, close to remove';
    el.appendChild(tab);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'preset-tab';
  addBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-2px;margin-right:3px"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg> New Slot';
  addBtn.onclick = () => {
    const name = prompt("Preset name:", "New Slot");
    if (name) addPreset(name);
  };
  el.appendChild(addBtn);
}

function renderPalette() {
  const el = document.getElementById('palette');
  const actions = document.getElementById('presetActions');
  const p = getPresetById(activePresetId);
  if (!p) { el.innerHTML = '<div class="empty-msg">No preset selected</div>'; return; }

  actions.innerHTML = '<button onclick="renameActive()">Rename</button><button onclick="clearColors()">Clear Colors</button>';

  el.innerHTML = '';
  p.colors.forEach((c, i) => {
    const { colorA, colorB } = getEntryColors(c);
    const swatchGrad = 'linear-gradient(to bottom,' + (c.inverted ? colorB : colorA) + ',' + (c.inverted ? colorA : colorB) + ')';
    const card = document.createElement('div');
    card.className = 'color-card' + (c.enabled === false ? ' disabled' : '');
    card.innerHTML = [
      '<div class="color-card-header">',
      '  <input type="checkbox" ' + (c.enabled !== false ? 'checked' : '') + ' onchange="setColorEnabled(\'' + p.id + '\',' + i + ',this.checked)" title="Include in preview/export">',
      '  <input class="name-input" value="' + c.name.replace(/'/g, "\\'") + '" onchange="updateColor(\'' + p.id + '\',' + i + ',\'name\',this.value)" placeholder="Color name">',
      '  <div class="color-card-controls">',
      '    <button class="btn-invert' + (c.inverted ? ' active' : '') + '" onclick="toggleInvert(\'' + p.id + '\',' + i + ')" title="Invert gradient"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="2" x2="8" y2="14"/><polyline points="4,5 8,2 12,5"/><polyline points="4,11 8,14 12,11"/></svg></button>',
      '    <button onclick="moveColor(\'' + p.id + '\',' + i + ',-1)" title="Move left"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="10,3 5,8 10,13"/></svg></button>',
      '    <button onclick="moveColor(\'' + p.id + '\',' + i + ',1)" title="Move right"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,3 11,8 6,13"/></svg></button>',
      '    <button onclick="duplicateColor(\'' + p.id + '\',' + i + ')" title="Duplicate"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M5 11H3.5A1.5 1.5 0 0 1 2 9.5v-7A1.5 1.5 0 0 1 3.5 1h7A1.5 1.5 0 0 1 12 2.5V5"/></svg></button>',
      '    <button class="danger" onclick="removeColor(\'' + p.id + '\',' + i + ')" title="Remove"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg></button>',
      '  </div>',
      '</div>',
      '<div class="color-row">',
      '  <label>Base</label>',
      '  <div class="color-pick-group">',
      '    <input type="color" value="' + c.base + '" onchange="updateColor(\'' + p.id + '\',' + i + ',\'base\',this.value)">',
      '    <input class="hex-input" value="' + c.base + '" onchange="updateColor(\'' + p.id + '\',' + i + ',\'base\',this.value)" onfocus="this.select()">',
      '  </div>',
      '</div>',
      '<div class="var-row">',
      '  <label>Var</label>',
      '  <input type="range" min="0" max="100" value="' + c.variation + '" oninput="updateVariation(\'' + p.id + '\',' + i + ',this.value)">',
      '  <span class="var-val">' + Math.round(c.variation) + '%</span>',
      '</div>',
      '<div class="mini-swatch" style="background:' + swatchGrad + '"></div>',
    ].join('');
    el.appendChild(card);
  });
  if (p.colors.length === 0) {
    el.innerHTML = '<div class="empty-msg">No colors in this slot. Click "+ Add Color" to add one.</div>';
  }
  renderAll();
}

function renameActive() {
  const p = getPresetById(activePresetId);
  if (!p) return;
  const name = prompt("Rename slot:", p.name);
  if (name) renamePreset(p.id, name);
}

function clearColors() {
  const p = getPresetById(activePresetId);
  if (!p) return;
  if (p.colors.length === 0) return;
  if (!confirm("Remove all colors from this slot?")) return;
  p.colors = [];
  renderPalette();
  renderAll();
}

const ROW_H = 44;
const CIRCLEROW_H = 50;
const LABEL_W = 80;
const NAME_H = 12;

function renderStripeRow(ctx, entries, y, rowH, barX, barW) {
  const headerH = NAME_H;
  const barH = rowH - headerH;
  const barY = y + headerH;
  const segW = barW / (entries.length || 1);
  ctx.font = "9px system-ui, sans-serif";
  ctx.textAlign = "center";
  for (let s = 0; s < entries.length; s++) {
    const x0 = Math.floor(barX + s * segW);
    const x1 = Math.floor(barX + (s + 1) * segW);
    const midX = (x0 + x1) / 2;
    ctx.fillStyle = "#111118";
    ctx.fillRect(x0, y, x1 - x0 - 1, headerH - 2);
    ctx.fillStyle = "#aaa";
    ctx.fillText(entries[s].name, midX, y + 9);
    for (let dy = 0; dy < barH - 2; dy++) {
      const t = dy / (barH - 3 || 1);
      const [r,g,b] = sampleEntryGradient(entries[s], t);
      ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
      ctx.fillRect(x0, barY + 1 + dy, x1 - x0, 1);
    }
  }
}

function renderCircleRow(ctx, entries, y, rowH, barX, barW) {
  const headerH = NAME_H;
  const circH = rowH - headerH;
  const circY = y + headerH;
  const n = entries.length || 1;
  const spacing = barW / n;
  const radius = Math.min(spacing, circH) * 0.3;
  const cy = circY + circH / 2;
  ctx.font = "9px system-ui, sans-serif";
  ctx.textAlign = "center";
  for (let s = 0; s < entries.length; s++) {
    const cx = barX + s * spacing + spacing / 2;
    const segX0 = Math.floor(barX + s * spacing);
    const segX1 = Math.floor(barX + (s + 1) * spacing);
    ctx.fillStyle = "#111118";
    ctx.fillRect(segX0, y, segX1 - segX0 - 1, headerH - 2);
    ctx.fillStyle = "#aaa";
    ctx.fillText(entries[s].name, cx, y + 9);
    for (let dy = -Math.ceil(radius); dy <= Math.ceil(radius); dy++) {
      for (let dx = -Math.ceil(radius); dx <= Math.ceil(radius); dx++) {
        const px = Math.round(cx + dx);
        const py = Math.round(cy + dy);
        if (px < barX || px >= barX + barW || py < circY || py >= circY + circH) continue;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > radius) continue;
        const t = dist / radius;
        const [r, g, b] = sampleEntryGradient(entries[s], t);
        ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
        ctx.fillRect(px, py, 1, 1);
      }
    }
  }
}

function renderStripes() {
  const canvas = document.getElementById('previewStripes');
  const wrap = canvas.parentElement;
  const W = wrap.clientWidth - 4;
  const H = presets.length * ROW_H;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  presets.forEach((p, pi) => {
    const y = pi * ROW_H;
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(0, y, LABEL_W, ROW_H - 1);
    ctx.fillStyle = p.id === activePresetId ? "#e94560" : "#888";
    ctx.font = (p.id === activePresetId ? "bold " : "") + "9px system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(p.name, LABEL_W - 4, y + NAME_H + 8);

    const barX = LABEL_W;
    const barW = W - barX;
    renderStripeRow(ctx, p.colors.filter(c => c.enabled !== false), y, ROW_H, barX, barW);
  });
}

function renderCircles() {
  const canvas = document.getElementById('previewCircles');
  const wrap = canvas.parentElement;
  const W = wrap.clientWidth - 4;
  const H = presets.length * CIRCLEROW_H;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  presets.forEach((p, pi) => {
    const y = pi * CIRCLEROW_H;
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(0, y, LABEL_W, CIRCLEROW_H - 1);
    ctx.fillStyle = p.id === activePresetId ? "#e94560" : "#888";
    ctx.font = (p.id === activePresetId ? "bold " : "") + "9px system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(p.name, LABEL_W - 4, y + NAME_H + 8);

    const barX = LABEL_W;
    const barW = W - barX;
    renderCircleRow(ctx, p.colors.filter(c => c.enabled !== false), y, CIRCLEROW_H, barX, barW);
  });
}

function renderAll() {
  renderStripes();
  renderCircles();
}

function switchPreviewTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + name + '"]').classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'stripes') renderStripes();
  else renderCircles();
}

function saveAll() {
  const data = presets.map(p => ({
    name: p.name,
    colors: p.colors.map(c => ({ name: c.name, base: c.base, variation: c.variation, enabled: c.enabled !== false, inverted: !!c.inverted }))
  }));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'palette.json';
  a.click();
}

function loadAll() {
  document.getElementById('fileInput').click();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      let data = JSON.parse(ev.target.result);
      presets = data.map((p, i) => ({
        id: "p" + (i + 1),
        name: p.name,
    colors: p.colors.map(c => ({ name: c.name, base: c.base, variation: c.variation, enabled: c.enabled !== false, inverted: !!c.inverted }))
      }));
      nextId = presets.length + 1;
      activePresetId = presets[0]?.id || null;
      renderAll();
    } catch { alert('Invalid palette file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function exportPNG() {
  const W = parseInt(document.getElementById('expW').value) || 512;
  const shape = document.getElementById('expShape').value;
  if (presets.length === 0) { alert('No presets'); return; }

  const rowH = shape === 'stripe' ? ROW_H : CIRCLEROW_H;
  const H = presets.length * rowH;
  const barX = 0;
  const barW = W;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  presets.forEach((p, pi) => {
    const y = pi * rowH;
    const colors = p.colors.filter(c => c.enabled !== false);
    if (shape === 'stripe') {
      renderStripeRow(ctx, colors, y, rowH, barX, barW);
    } else {
      renderCircleRow(ctx, colors, y, rowH, barX, barW);
    }
  });

  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'palette_' + shape + '_' + W + 'x' + H + '.png';
  a.click();
}

function restoreDefaults() {
  if (!confirm("Reset all presets to defaults? Custom changes will be lost.")) return;
  init();
}

function init() {
  presets = INITIAL_PRESETS.map((p, i) => ({ id: "p" + (i + 1), ...p }));
  nextId = presets.length + 1;
  activePresetId = presets[0].id;
  renderPresetTabs();
  renderPalette();
}

init();
</script>

<title>Low Poly Palette Generator</title>
<style>

body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }

.color-pick-group input[type="color"]::-webkit-color-swatch { border: 1px solid #555; border-radius: 3px; }

.export-row input[type="number"]:focus { outline: none; border-color: #e94560; }
.export-row select { background: #0f3460; border: 1px solid #555; color: #fff; padding: 3px 6px; border-radius: 4px; font-size: 0.82rem; }

.btn-secondary { background: #0f3460; }

<body>
<div class="container">

      <div class="subtitle">Gradient color textures for d3 game terrain</div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="saveAll()">Save</button>
      <button class="btn btn-secondary" onclick="loadAll()">Load</button>
      <button class="btn btn-secondary" onclick="restoreDefaults()">Restore</button>
      <input type="file" id="fileInput" accept=".json" onchange="handleFile(event)">
    </div>

  <div id="presetTabs" class="preset-tabs"></div>

  <div id="presetActions" class="preset-actions"></div>

  <div id="palette" class="palette-grid"></div>
  <button class="add-btn" onclick="addColorToActive()">+ Add Color</button>

  <div class="tabs">
    <button class="tab active" data-tab="stripes" onclick="switchPreviewTab('stripes')">Stripes</button>
    <button class="tab" data-tab="circles" onclick="switchPreviewTab('circles')">Circles</button>
  </div>

  <div id="tab-stripes" class="tab-content active preview-canvas-wrap">
    <canvas id="previewStripes" height="80"></canvas>
  </div>
  <div id="tab-circles" class="tab-content preview-canvas-wrap">
    <canvas id="previewCircles" height="120"></canvas>
  </div>

  <div class="export-section">
    <div class="export-row">
      <label>Width:</label><input type="number" id="expW" value="512" min="16" max="4096">
      <label>Shape:</label>
      <select id="expShape">
        <option value="stripe">Stripe</option>
        <option value="sphere">Spherical</option>
      </select>
      <button class="btn" onclick="exportPNG()">Export PNG</button>
    </div>

<script>
function hexToRgb(h) {
  const r = parseInt(h.slice(1,3), 16);
  const g = parseInt(h.slice(3,5), 16);
  const b = parseInt(h.slice(5,7), 16);
  return [r,g,b];
}

function rgbToHex(r,g,b) {
  return '#' + [r,g,b].map(c => Math.max(0, Math.min(255, Math.round(c))).toString(16).padStart(2,'0')).join('');
}

function lerp(a,b,t) { return a + (b-a)*t; }

function computeGradient(base, variation) {
  const p = variation / 100;
  const [br, bg, bb] = hexToRgb(base);
  const colorA = rgbToHex(lerp(br, 255, p), lerp(bg, 255, p), lerp(bb, 255, p));
  const colorB = rgbToHex(lerp(br, 0, p), lerp(bg, 0, p), lerp(bb, 0, p));
  return { colorA, colorB };
}

function getEntryColors(entry) {
  return computeGradient(entry.base, entry.variation);
}

function sampleEntryGradient(entry, t) {
  const { colorA, colorB } = getEntryColors(entry);
  const [r1,g1,b1] = hexToRgb(colorA);
  const [r2,g2,b2] = hexToRgb(colorB);
  return [lerp(r1,r2,t), lerp(g1,g2,t), lerp(b1,b2,t)];
}

let presets = [];
let activePresetId = null;
let nextId = 1;

function getPresetById(id) { return presets.find(p => p.id === id); }

function addPreset(name) {
  const id = "p" + (nextId++);
  presets.push({ id, name, colors: [] });
  activePresetId = id;
  renderPresetTabs();
  renderPalette();
}

function removePreset(id) {
  if (presets.length <= 1) return;
  const idx = presets.findIndex(p => p.id === id);
  presets.splice(idx, 1);
  if (activePresetId === id) {
    activePresetId = presets[Math.min(idx, presets.length - 1)].id;
  }
  renderPresetTabs();
  renderPalette();
}

function renamePreset(id, name) {
  const p = getPresetById(id);
  if (p) p.name = name;
  renderPresetTabs();
}

function setActivePreset(id) {
  activePresetId = id;
  renderPresetTabs();
  renderPalette();
}

function addColorToActive() {
  const p = getPresetById(activePresetId);
  if (!p) return;
  p.colors.push({ name: "New Color", base: "#808080", variation: 20 });
  renderPalette();
  renderAll();
}

function removeColor(pid, idx) {
  const p = getPresetById(pid);
  if (!p) return;
  p.colors.splice(idx, 1);
  renderPalette();
  renderAll();
}

function moveColor(pid, idx, dir) {
  const p = getPresetById(pid);
  if (!p) return;
  const j = idx + dir;
  if (j < 0 || j >= p.colors.length) return;
  [p.colors[idx], p.colors[j]] = [p.colors[j], p.colors[idx]];
  renderPalette();
  renderAll();
}

function updateColor(pid, idx, field, value) {
  const p = getPresetById(pid);
  if (!p) return;
  const c = p.colors[idx];
  if (field === 'base') {
    c.base = value.startsWith('#') ? value : '#' + value;
  } else if (field === 'variation') {
    c.variation = Math.max(0, Math.min(100, parseFloat(value) || 0));
  } else {
    c.name = value;
  }
  renderPalette();
  renderAll();
}

function updateVariation(pid, idx, value) {
  const p = getPresetById(pid);
  if (!p) return;
  const c = p.colors[idx];
  c.variation = Math.max(0, Math.min(100, parseFloat(value) || 0));
  const card = document.getElementById('palette').children[idx];
  if (card) {
    card.querySelector('.var-val').textContent = Math.round(c.variation) + '%';
    const { colorA, colorB } = getEntryColors(c);
    const swatch = card.querySelector('.mini-swatch');
    if (swatch) swatch.style.background = 'linear-gradient(to right,' + colorA + ',' + colorB + ')';
  }
  renderAll();
}

function renderPresetTabs() {
  const el = document.getElementById('presetTabs');
  el.innerHTML = '';
  presets.forEach(p => {
    const tab = document.createElement('button');
    tab.className = 'preset-tab' + (p.id === activePresetId ? ' active' : '');
    tab.innerHTML = '<span>' + p.name + '</span><span class="close-btn" onclick="event.stopPropagation();removePreset(\'' + p.id + '\')">&times;</span>';
    tab.onclick = () => setActivePreset(p.id);
    tab.title = 'Click to edit, close to remove';
    el.appendChild(tab);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'preset-tab';
  addBtn.textContent = '+ New Slot';
  addBtn.onclick = () => {
    const name = prompt("Preset name:", "New Slot");
    if (name) addPreset(name);
  };
  el.appendChild(addBtn);
}

function renderPalette() {
  const el = document.getElementById('palette');
  const actions = document.getElementById('presetActions');
  const p = getPresetById(activePresetId);
  if (!p) { el.innerHTML = '<div class="empty-msg">No preset selected</div>'; return; }

  actions.innerHTML = '<button onclick="renameActive()">Rename</button><button onclick="clearColors()">Clear Colors</button>';

  el.innerHTML = '';
  p.colors.forEach((c, i) => {
    const { colorA, colorB } = getEntryColors(c);
    const card = document.createElement('div');
    card.className = 'color-card';
    card.innerHTML = [
      '<div class="color-card-header">',
      '  <input class="name-input" value="' + c.name.replace(/'/g, "\\'") + '" onchange="updateColor(\'' + p.id + '\',' + i + ',\'name\',this.value)" placeholder="Color name">',
      '  <div class="color-card-controls">',
      '    <button onclick="moveColor(\'' + p.id + '\',' + i + ',-1)" title="Move left">&lsaquo;</button>',
      '    <button onclick="moveColor(\'' + p.id + '\',' + i + ',1)" title="Move right">&rsaquo;</button>',
      '    <button class="danger" onclick="removeColor(\'' + p.id + '\',' + i + ')" title="Remove">&times;</button>',
      '  </div>',
      '</div>',
      '<div class="color-row">',
      '  <label>Base</label>',
      '  <div class="color-pick-group">',
      '    <input type="color" value="' + c.base + '" onchange="updateColor(\'' + p.id + '\',' + i + ',\'base\',this.value)">',
      '    <input class="hex-input" value="' + c.base + '" onchange="updateColor(\'' + p.id + '\',' + i + ',\'base\',this.value)" onfocus="this.select()">',
      '  </div>',
      '</div>',
      '<div class="var-row">',
      '  <label>Var</label>',
      '  <input type="range" min="0" max="100" value="' + c.variation + '" oninput="updateVariation(\'' + p.id + '\',' + i + ',this.value)">',
      '  <span class="var-val">' + Math.round(c.variation) + '%</span>',
      '</div>',
      '<div class="mini-swatch" style="background:linear-gradient(to right,' + colorA + ',' + colorB + ')"></div>',
    ].join('');
    el.appendChild(card);
  });
  if (p.colors.length === 0) {
    el.innerHTML = '<div class="empty-msg">No colors in this slot. Click "+ Add Color" to add one.</div>';
  }
  renderAll();
}

function renameActive() {
  const p = getPresetById(activePresetId);
  if (!p) return;
  const name = prompt("Rename slot:", p.name);
  if (name) renamePreset(p.id, name);
}

function clearColors() {
  const p = getPresetById(activePresetId);
  if (!p) return;
  if (p.colors.length === 0) return;
  if (!confirm("Remove all colors from this slot?")) return;
  p.colors = [];
  renderPalette();
  renderAll();
}

const ROW_H = 44;
const CIRCLEROW_H = 50;
const LABEL_W = 80;
const NAME_H = 12;

function renderStripeRow(ctx, entries, y, rowH, barX, barW) {
  const headerH = NAME_H;
  const barH = rowH - headerH;
  const barY = y + headerH;
  const segW = barW / (entries.length || 1);
  ctx.font = "9px system-ui, sans-serif";
  ctx.textAlign = "center";
  for (let s = 0; s < entries.length; s++) {
    const x0 = Math.floor(barX + s * segW);
    const x1 = Math.floor(barX + (s + 1) * segW);
    const midX = (x0 + x1) / 2;
    ctx.fillStyle = "#111118";
    ctx.fillRect(x0, y, x1 - x0 - 1, headerH - 2);
    ctx.fillStyle = "#aaa";
    ctx.fillText(entries[s].name, midX, y + 9);
    for (let x = x0; x < x1 && x < barX + barW; x++) {
      const t = (x - x0) / (x1 - x0 - 1 || 1);
      const [r,g,b] = sampleEntryGradient(entries[s], t);
      ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
      ctx.fillRect(x, barY + 1, 1, barH - 2);
    }
  }
}

function renderCircleRow(ctx, entries, y, rowH, barX, barW) {
  const headerH = NAME_H;
  const circH = rowH - headerH;
  const circY = y + headerH;
  const n = entries.length || 1;
  const spacing = barW / n;
  const radius = Math.min(spacing, circH) * 0.3;
  const cy = circY + circH / 2;
  ctx.font = "9px system-ui, sans-serif";
  ctx.textAlign = "center";
  for (let s = 0; s < entries.length; s++) {
    const cx = barX + s * spacing + spacing / 2;
    const segX0 = Math.floor(barX + s * spacing);
    const segX1 = Math.floor(barX + (s + 1) * spacing);
    ctx.fillStyle = "#111118";
    ctx.fillRect(segX0, y, segX1 - segX0 - 1, headerH - 2);
    ctx.fillStyle = "#aaa";
    ctx.fillText(entries[s].name, cx, y + 9);
    for (let dy = -Math.ceil(radius); dy <= Math.ceil(radius); dy++) {
      for (let dx = -Math.ceil(radius); dx <= Math.ceil(radius); dx++) {
        const px = Math.round(cx + dx);
        const py = Math.round(cy + dy);
        if (px < barX || px >= barX + barW || py < circY || py >= circY + circH) continue;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > radius) continue;
        const t = dist / radius;
        const [r, g, b] = sampleEntryGradient(entries[s], t);
        ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
        ctx.fillRect(px, py, 1, 1);
      }
    }
  }
}

function renderStripes() {
  const canvas = document.getElementById('previewStripes');
  const wrap = canvas.parentElement;
  const W = wrap.clientWidth - 4;
  const H = presets.length * ROW_H;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  presets.forEach((p, pi) => {
    const y = pi * ROW_H;
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(0, y, LABEL_W, ROW_H - 1);
    ctx.fillStyle = p.id === activePresetId ? "#e94560" : "#888";
    ctx.font = (p.id === activePresetId ? "bold " : "") + "9px system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(p.name, LABEL_W - 4, y + NAME_H + 8);

    const barX = LABEL_W;
    const barW = W - barX;
    renderStripeRow(ctx, p.colors, y, ROW_H, barX, barW);
  });
}

function renderCircles() {
  const canvas = document.getElementById('previewCircles');
  const wrap = canvas.parentElement;
  const W = wrap.clientWidth - 4;
  const H = presets.length * CIRCLEROW_H;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  presets.forEach((p, pi) => {
    const y = pi * CIRCLEROW_H;
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(0, y, LABEL_W, CIRCLEROW_H - 1);
    ctx.fillStyle = p.id === activePresetId ? "#e94560" : "#888";
    ctx.font = (p.id === activePresetId ? "bold " : "") + "9px system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(p.name, LABEL_W - 4, y + NAME_H + 8);

    const barX = LABEL_W;
    const barW = W - barX;
    renderCircleRow(ctx, p.colors, y, CIRCLEROW_H, barX, barW);
  });
}

function renderAll() {
  renderStripes();
  renderCircles();
}

function switchPreviewTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-tab="' + name + '"]').classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'stripes') renderStripes();
  else renderCircles();
}

function saveAll() {
  const data = presets.map(p => ({
    name: p.name,
    colors: p.colors.map(c => ({ name: c.name, base: c.base, variation: c.variation }))
  }));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'palette.json';
  a.click();
}

function loadAll() {
  document.getElementById('fileInput').click();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      let data = JSON.parse(ev.target.result);
      presets = data.map((p, i) => ({
        id: "p" + (i + 1),
        name: p.name,
        colors: p.colors.map(c => ({ name: c.name, base: c.base, variation: c.variation }))
      }));
      nextId = presets.length + 1;
      activePresetId = presets[0]?.id || null;
      renderAll();
    } catch { alert('Invalid palette file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function exportPNG() {
  const W = parseInt(document.getElementById('expW').value) || 512;
  const shape = document.getElementById('expShape').value;
  if (presets.length === 0) { alert('No presets'); return; }

  const rowH = shape === 'stripe' ? ROW_H : CIRCLEROW_H;
  const H = presets.length * rowH;
  const barX = 0;
  const barW = W;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  presets.forEach((p, pi) => {
    const y = pi * rowH;
    if (shape === 'stripe') {
      renderStripeRow(ctx, p.colors, y, rowH, barX, barW);
    } else {
      renderCircleRow(ctx, p.colors, y, rowH, barX, barW);
    }
  });

  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'palette_' + shape + '_' + W + 'x' + H + '.png';
  a.click();
}

function restoreDefaults() {
  if (!confirm("Reset all presets to defaults? Custom changes will be lost.")) return;
  init();
}

function init() {
  presets = INITIAL_PRESETS.map((p, i) => ({ id: "p" + (i + 1), ...p }));
  nextId = presets.length + 1;
  activePresetId = presets[0].id;
  renderPresetTabs();
  renderPalette();
}

init();
</script>
</body>
</html>
